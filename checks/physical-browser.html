<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Physical renderer GPU verification</title>
<style>body{margin:0;background:#08090d;color:white}canvas{width:640px;height:400px}pre{white-space:pre-wrap}</style>
<canvas id="cosmos" width="640" height="400"></canvas><pre id="report"></pre>
<script src="../dist/relativity.js"></script><script src="../dist/astrophysics.js"></script><script src="../dist/plasma.js"></script><script src="../dist/grmhd-continuation.js"></script><script src="../dist/physical-renderer.js"></script>
<script>
// This page is deliberately outside dist: diagnostic controls and GPU readbacks
// are used for verification without becoming part of the published product.
window.runPhysicalCase=async function(options={}){
 const scene=options.scene||"quasar",preset=BlackHoleAstrophysics.scenes[scene];
 const state={scene,model:preset.model,spin:preset.spin,charge:preset.charge,band:preset.band,tilt:preset.tilt,observer:"static",display:"intensity",yaw:0,drift:0,time:0,viewZoom:1,zoom:1,paused:true,density:4096,exposure:1,...options};
 const canvas=document.getElementById("cosmos");window.currentEngine?.dispose();
 // Explicit renderer verification options never enter the product configuration
 // validator: they fix budgets/domain/spectra for independent numerical oracles.
 // A numerical case samples pixel centers once. Progressive display averaging
 // has its own independent GPU checks and must not move this oracle's rays.
 const engine=BlackHolePhysicalRenderer.create({canvas,state,verification:options.verification||{progressiveSamples:1},onNeedsFrame(){},onStatus(message){document.getElementById("report").textContent=message;}});window.currentEngine=engine;window.caseState=state;
 engine.draw({width:640,height:400,scale:400*.028*state.viewZoom},0);
 if(preset.flow==="grmhd"){for(let i=0;i<100&&engine.metrics.dataStatus==="loading";i++)await new Promise(r=>setTimeout(r,100));engine.refine();engine.draw({width:640,height:400,scale:400*.028*state.viewZoom},0);}
 const image=engine.readback();let light=0,maximum=0,polarizationError=0,finite=true,captured=0,escaped=0,opaque=0;
 for(let i=0;i<image.radiance.length;i+=4){let value=image.radiance[i]+image.radiance[i+1]+image.radiance[i+2];light+=value;maximum=Math.max(maximum,value);for(let k=0;k<4;k++)finite&&=Number.isFinite(image.radiance[i+k])&&Number.isFinite(image.stokes[i+k]);polarizationError=Math.max(polarizationError,Math.hypot(image.stokes[i+1],image.stokes[i+2],image.stokes[i+3])-image.stokes[i]);if(image.diagnostic[i]===1)escaped++;if(image.diagnostic[i]===2)captured++;if(image.diagnostic[i]===3)opaque++;}
 let unfinishedRays=0,invalidRays=0,unfinishedRadiusMin=Infinity,unfinishedRadiusMax=0,negativeEnergyUnfinished=0;const camera=BlackHoleAstrophysics.camera(state,BlackHoleAstrophysics.model(state));
 // Complete synchronous status readback is the acceptance source. Production
 // diagnostics intentionally arrive asynchronously and may still be pending.
 for(let i=0;i<image.diagnostic.length;i+=4){if(image.diagnostic[i]===0)unfinishedRays++;if(image.diagnostic[i]===4)invalidRays++;}
 for(let i=0;i<image.diagnostic.length;i+=4)if(image.diagnostic[i]===0){unfinishedRadiusMin=Math.min(unfinishedRadiusMin,image.diagnostic[i+3]);unfinishedRadiusMax=Math.max(unfinishedRadiusMax,image.diagnostic[i+3]);const pixel=i/4,alpha=((pixel%image.width+.5)/image.width-.5)*640/(400*.028*state.viewZoom),beta=((Math.floor(pixel/image.width)+.5)/image.height-.5)*400/(400*.028*state.viewZoom);if(BlackHoleRelativity.initialRay(camera,alpha,beta).p[3]<0)negativeEnergyUnfinished++;}
 let polarizationMaximum=0;for(let i=0;i<image.stokes.length;i+=4)if(image.stokes[i]>.001)polarizationMaximum=Math.max(polarizationMaximum,Math.hypot(image.stokes[i+1],image.stokes[i+2],image.stokes[i+3])/image.stokes[i]);
 window.result={scene,...engine.metrics,unfinishedRays,invalidRays,light,maximum,polarizationError,polarizationMaximum,finite,captured,escaped,opaque,unfinishedRadiusMin,unfinishedRadiusMax,negativeEnergyUnfinished};document.getElementById("report").textContent=JSON.stringify(window.result,null,2);return window.result;
};
window.probeCoefficients=function(){
 // Exercise the exact production GLSL at cgs magnitudes. A finite rendered
 // image alone would not detect a zero/NaN radio Planck function.
 window.currentEngine?.dispose();const gl=document.getElementById("cosmos").getContext("webgl2");
 const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader;};
 const vs=compile(gl.VERTEX_SHADER,'#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
 const fs=compile(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;uniform vec3 bess;layout(location=0) out vec4 emiss;layout(location=1) out vec4 coefficients;'+BlackHolePlasma.glsl+'\nvoid main(){vec3 rho;emiss=thermalSynch(1e6,30.,10.,230e9,.5,bess,rho);coefficients=vec4(plasmaPlanck(230e9,10.*5.92989658e9),rho.x,rho.z,plasmaPlanck(230e9,1e11));}');
 const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);const textures=[];
 for(let i=0;i<2;i++){const t=gl.createTexture();textures.push(t);gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,1,1,0,gl.RGBA,gl.FLOAT,null);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0);}
 gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);gl.viewport(0,0,1,1);gl.useProgram(program);gl.uniform3fv(gl.getUniformLocation(program,'bess'),[0,1,2].map(n=>BlackHolePlasma.besselK(n,.1)));
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);
 const output=[];for(let i=0;i<2;i++){const value=new Float32Array(4);gl.readBuffer(gl.COLOR_ATTACHMENT0+i);gl.readPixels(0,0,1,1,gl.RGBA,gl.FLOAT,value);output.push(Array.from(value));}
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteBuffer(buffer);textures.forEach(t=>gl.deleteTexture(t));gl.deleteFramebuffer(fbo);gl.deleteProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);
 const cpu=BlackHolePlasma.thermalCoefficients(1e6,30,10,230e9,.5);return {gpu:output,cpu:{j:cpu.j,rho:cpu.rho,planck:BlackHoleAstrophysics.planckNu(230e9,10*5.92989658e9)*1e3,hotPlanck:BlackHoleAstrophysics.planckNu(230e9,1e11)*1e3}};
};
window.probeTransfer=function(){
 // Uniforms retain the production float32 branches. Tiny nonzero dichroism
 // beside a finite Faraday angle exercises eigenvalues that underflow in J².
 window.currentEngine?.dispose();const gl=document.getElementById('cosmos').getContext('webgl2');
 const shader=(type,text)=>{const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
 const v=shader(gl.VERTEX_SHADER,'#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
 const f=shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;uniform float alpha,ds;uniform vec3 dichroism,rotation;layout(location=0) out vec4 received;layout(location=1) out vec4 source;'+BlackHolePlasma.glsl+'\nvoid main(){mat4 m=attenuation(alpha,dichroism,rotation,ds,source);received=m*vec4(1.,.3,.4,.2);}');
 const program=gl.createProgram();gl.attachShader(program,v);gl.attachShader(program,f);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);const textures=[];
 for(let i=0;i<2;i++){const t=gl.createTexture();textures.push(t);gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,1,1,0,gl.RGBA,gl.FLOAT,null);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0);}
 gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);gl.viewport(0,0,1,1);gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 const cases=[{alpha:0,a:[0,0,0],rho:[0,0,6.68]},{alpha:0,a:[1e-30,-2e-30,3e-30],rho:[.4,-.2,125]},{alpha:1e-32,a:[3e-33,1e-33,0],rho:[10,20,80]},{alpha:.3,a:[0,0,0],rho:[.7,.2,12]},{alpha:.8,a:[.2,-.1,.05],rho:[.4,.2,.3]},{alpha:50,a:[10,0,0],rho:[0,0,500]},{alpha:1e13,a:[1e13,0,0],rho:[0,1e13,0]}],results=[];
 for(const c of cases){gl.uniform1f(gl.getUniformLocation(program,'alpha'),c.alpha);gl.uniform1f(gl.getUniformLocation(program,'ds'),1);gl.uniform3fv(gl.getUniformLocation(program,'dichroism'),c.a);gl.uniform3fv(gl.getUniformLocation(program,'rotation'),c.rho);gl.drawArrays(gl.TRIANGLES,0,3);
  const actual=[];for(let i=0;i<2;i++){const out=new Float32Array(4);gl.readBuffer(gl.COLOR_ATTACHMENT0+i);gl.readPixels(0,0,1,1,gl.RGBA,gl.FLOAT,out);actual.push(Array.from(out));}
  const m=BlackHolePlasma.attenuation(c.alpha,c.a,c.rho,1),input=[1,.3,.4,.2],expected=[m.map(row=>row.reduce((sum,x,j)=>sum+x*input[j],0)),m.map((row,j)=>Number(j===0)-row[0])];results.push({parameters:c,actual,expected});
 }
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.deleteBuffer(buffer);textures.forEach(t=>gl.deleteTexture(t));gl.deleteFramebuffer(fbo);gl.deleteProgram(program);gl.deleteShader(v);gl.deleteShader(f);return results;
};
window.runPhysicalCase().catch(error=>{window.result={error:String(error),stack:error.stack};document.getElementById("report").textContent=JSON.stringify(window.result,null,2);});
</script></html>
